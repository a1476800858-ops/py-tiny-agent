[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-tiny-claw"
version = "0.1.0"
description = "Python rewrite of the go-tiny-claw agent engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.0", "anthropic>=0.25"]
feishu = ["lark-oapi>=1.0"]

[project.scripts]
tiny-claw = "tiny_claw.cli:main"
tiny-claw-bench = "tiny_claw.eval:main"

[tool.setuptools.packages.find]
include = ["tiny_claw*"]

[tool.unittest]
test_dir = "tests"
